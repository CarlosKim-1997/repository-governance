name: Verify Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '20' }
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: macos-latest, node: '24' }
          - { os: windows-latest, node: '24' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Show runtimes
        run: |
          node --version
          npm --version
          python --version
      - run: npm ci
      - run: npm run build
      - name: Run full suite including packaged consumers
        run: npm test | tee "$RUNNER_TEMP/node-test.log"
      - name: Prove POSIX symlink cases executed
        if: runner.os != 'Windows'
        run: |
          grep -Fx '# skipped 0' "$RUNNER_TEMP/node-test.log"
          grep -E '^ok [0-9]+ - authoritative bootstrap symlinks cannot escape the repository$' "$RUNNER_TEMP/node-test.log"
          grep -E '^ok [0-9]+ - structured record file symlink outside root is rejected$' "$RUNNER_TEMP/node-test.log"
      - run: npm run check:template
      - name: Check tracked source remains clean
        run: |
          git diff --check
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.sha }}
          path: ${{ runner.temp }}/node-test.log
          if-no-files-found: warn
          retention-days: 14

  release-candidate:
    name: Verify source-bound release candidate
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: npm run release:bundle
      - run: npm run release:verify
      - name: Verify unrelated Python consumer from packed release archive
        run: |
          archive="$(realpath "$(find dist/release -maxdepth 1 -name 'repository-governance-*.tgz' -print -quit)")"
          test -n "$archive"
          harness="$(mktemp -d)"
          consumer="$(mktemp -d)"
          trap 'rm -rf "$harness" "$consumer"' EXIT
          printf '{"private":true}\n' > "$harness/package.json"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock --prefix "$harness" "$archive"
          cp -a tests/fixtures/python-utility/. "$consumer/"
          node "$harness/node_modules/repository-governance/tooling/init/init.mjs" init --greenfield --target "$consumer" --apply
          node "$consumer/tooling/governance/check.mjs" "$consumer"
          (cd "$consumer" && python -m unittest discover -s tests -v)
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repository-governance-release-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Check tracked source remains clean
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
